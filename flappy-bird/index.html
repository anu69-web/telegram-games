<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird Odyssey</title>
  <script src="https://telegram.org/js/games.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --gold: #facc15;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e1b4b 0%, var(--bg-dark) 100%);
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      max-height: 850px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      background: #0f172a;
    }
    #sound-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: transform 0.1s;
    }
    #sound-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <button id="sound-btn" onclick="toggleMute()">🔊</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Telegram session parameter extraction
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get("user_id");
    const chatId = urlParams.get("chat_id");
    const messageId = urlParams.get("msg_id");
    const inlineId = urlParams.get("inline_id");
    const botToken = urlParams.get("token");

    const LOGICAL_WIDTH = 360;
    const LOGICAL_HEIGHT = 640;
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      const container = document.getElementById("game-container");
      const rect = container.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(canvas.width / LOGICAL_WIDTH, canvas.height / LOGICAL_HEIGHT);
      ctx.imageSmoothingEnabled = true;
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 150));
    resizeCanvas();

    // ==========================================
    // Web Audio Synthesizer Engine
    // ==========================================
    let isMuted = false;
    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById("sound-btn").innerText = isMuted ? "🔇" : "🔊";
    }

    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      },
      playFlap() {
        if (isMuted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(640, this.ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch (e) {}
      },
      playScore() {
        if (isMuted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(587.33, this.ctx.currentTime); // D5
          osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08); // A5
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.22);
        } catch (e) {}
      },
      playBonus() {
        if (isMuted) return;
        try {
          this.init();
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.05 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + i * 0.05);
            osc.stop(this.ctx.currentTime + i * 0.05 + 0.25);
          });
        } catch (e) {}
      },
      playShieldBreak() {
        if (isMuted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(700, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.2);
        } catch (e) {}
      },
      playHit() {
        if (isMuted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch (e) {}
      },
      playGameOver() {
        if (isMuted) return;
        try {
          this.init();
          [440, 392, 349.23, 261.63].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.25, this.ctx.currentTime + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.12 + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + i * 0.12);
            osc.stop(this.ctx.currentTime + i * 0.12 + 0.35);
          });
        } catch (e) {}
      }
    };

    // ==========================================
    // Game Physics & State
    // ==========================================
    let score = 0;
    let highscore = parseInt(localStorage.getItem("flappy_hi") || "0", 10);
    let isNewHighscore = false;
    let gameState = "START"; // "START", "PLAYING", "GAMEOVER"
    let frame = 0;
    let pipeSpeed = 2.4;
    let hasShield = false;
    let shieldInvulTimer = 0;
    let gameOverTime = 0;
    const RESTART_COOLDOWN_MS = 1500;

    const GRAVITY = 0.42;
    const JUMP_STRENGTH = -7.2;
    const PIPE_WIDTH = 58;
    const PIPE_GAP = 148;
    const GROUND_HEIGHT = 80;

    const bird = {
      x: 75,
      y: LOGICAL_HEIGHT / 2 - 20,
      radius: 15,
      velocity: 0,
      rotation: 0,
      wingCycle: 0,
      blinkTimer: 0,
      reset() {
        this.x = 75;
        this.y = LOGICAL_HEIGHT / 2 - 20;
        this.velocity = 0;
        this.rotation = 0;
        this.wingCycle = 0;
        this.blinkTimer = 0;
      },
      flap() {
        this.velocity = JUMP_STRENGTH;
        AudioEngine.playFlap();
        createDustParticles(this.x - 10, this.y + 10);
      }
    };

    let pipes = [];
    let items = [];
    let particles = [];
    let popups = [];

    // Background Stars & Clouds
    const stars = Array.from({ length: 35 }, () => ({
      x: Math.random() * LOGICAL_WIDTH,
      y: Math.random() * (LOGICAL_HEIGHT - GROUND_HEIGHT),
      size: Math.random() * 2 + 1,
      alpha: Math.random() * 0.7 + 0.3,
      speed: Math.random() * 0.2 + 0.05
    }));

    const clouds = [
      { x: 40, y: 110, w: 90, h: 32, speed: 0.35 },
      { x: 220, y: 170, w: 120, h: 40, speed: 0.5 },
      { x: 340, y: 80, w: 80, h: 28, speed: 0.3 }
    ];

    let groundOffset = 0;

    // ==========================================
    // Particles & Popups
    // ==========================================
    function createDustParticles(x, y) {
      for (let i = 0; i < 5; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.7) * 2,
          vy: Math.random() * 1.5 + 0.5,
          radius: Math.random() * 3 + 2,
          color: "rgba(255, 255, 255, 0.6)",
          life: 1,
          decay: 0.06
        });
      }
    }

    function createSparkleBurst(x, y, color = "#facc15") {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1.5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 2,
          color,
          life: 1,
          decay: 0.04
        });
      }
    }

    function addScorePopup(text, x, y, color = "#facc15") {
      popups.push({
        text,
        x,
        y,
        color,
        alpha: 1,
        vy: -1.8,
        scale: 1.4
      });
    }

    // ==========================================
    // Telegram Score Syncing
    // ==========================================
    async function syncTelegramScore(finalScore) {
      if (!botToken || !userId || finalScore <= 0) return;
      const targetIdNum = parseInt(userId, 10);
      if (isNaN(targetIdNum) || targetIdNum <= 0) return;

      const body = {
        user_id: targetIdNum,
        score: parseInt(finalScore, 10),
        force: true,
        disable_edit_message: false
      };

      if (inlineId && inlineId.trim() !== "" && inlineId !== "null" && inlineId !== "undefined") {
        body.inline_message_id = inlineId.trim();
      } else if (chatId && messageId) {
        const cId = parseInt(chatId, 10);
        const mId = parseInt(messageId, 10);
        if (!isNaN(cId) && !isNaN(mId)) {
          body.chat_id = cId;
          body.message_id = mId;
        } else {
          return;
        }
      } else {
        return;
      }

      try {
        await fetch(`https://api.telegram.org/bot${botToken}/setGameScore`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
      } catch (err) {
        console.warn("Telegram Game Score sync error:", err);
      }
    }

    function triggerGameOver() {
      gameState = "GAMEOVER";
      gameOverTime = performance.now();
      AudioEngine.playHit();
      setTimeout(() => AudioEngine.playGameOver(), 200);

      isNewHighscore = false;
      if (score > highscore) {
        highscore = score;
        localStorage.setItem("flappy_hi", highscore);
        isNewHighscore = true;
      }

      syncTelegramScore(score);

      try {
        if (window.TelegramGameProxy && typeof window.TelegramGameProxy.setScore === "function") {
          window.TelegramGameProxy.setScore(score);
        }
      } catch (e) {}
    }

    function resetGame() {
      score = 0;
      pipeSpeed = 2.4;
      hasShield = false;
      shieldInvulTimer = 0;
      pipes = [];
      items = [];
      particles = [];
      popups = [];
      bird.reset();
      gameState = "PLAYING";
      bird.flap();
    }

    // ==========================================
    // Pipe & Powerup Management
    // ==========================================
    function spawnPipe() {
      const minTop = 60;
      const maxTop = LOGICAL_HEIGHT - GROUND_HEIGHT - PIPE_GAP - 60;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
      const bottomY = topHeight + PIPE_GAP;
      const bottomHeight = LOGICAL_HEIGHT - GROUND_HEIGHT - bottomY;

      pipes.push({
        x: LOGICAL_WIDTH + 10,
        top: topHeight,
        bottomY: bottomY,
        bottomHeight: bottomHeight,
        passed: false
      });

      // 35% chance to spawn a bonus collectible item in the gap
      if (Math.random() < 0.35) {
        const itemTypes = [
          { type: "coin", emoji: "🪙", pts: 1, color: "#facc15" },
          { type: "star", emoji: "⭐", pts: 3, color: "#fbbf24" },
          { type: "gem", emoji: "💎", pts: 5, color: "#38bdf8" },
          { type: "shield", emoji: "🛡️", pts: 0, color: "#a855f7", isShield: true }
        ];
        const selected = itemTypes[Math.floor(Math.random() * itemTypes.length)];
        items.push({
          x: LOGICAL_WIDTH + 10 + PIPE_WIDTH / 2,
          y: topHeight + PIPE_GAP / 2 + (Math.random() * 30 - 15),
          ...selected,
          floatOffset: Math.random() * Math.PI * 2
        });
      }
    }

    // ==========================================
    // User Input Handling
    // ==========================================
    function handleAction() {
      AudioEngine.init();
      if (gameState === "START") {
        resetGame();
      } else if (gameState === "PLAYING") {
        bird.flap();
      } else if (gameState === "GAMEOVER") {
        if (performance.now() - gameOverTime < RESTART_COOLDOWN_MS) {
          return; // Ignore rapid taps during cooldown to allow score saving
        }
        resetGame();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp" || e.key === " ") {
        e.preventDefault();
        handleAction();
      }
    });

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handleAction();
    });

    // ==========================================
    // Main Game Loop
    // ==========================================
    function update() {
      frame++;

      // Parallax Stars
      stars.forEach(s => {
        s.x -= s.speed;
        if (s.x < 0) s.x = LOGICAL_WIDTH;
      });

      // Parallax Clouds
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x + c.w < 0) c.x = LOGICAL_WIDTH + 40;
      });

      if (gameState === "START") {
        bird.y = LOGICAL_HEIGHT / 2 - 20 + Math.sin(frame * 0.08) * 8;
        bird.wingCycle = Math.sin(frame * 0.15);
        groundOffset = (groundOffset + 1.5) % 24;
        return;
      }

      if (gameState === "PLAYING") {
        // Difficulty scaling
        pipeSpeed = 2.4 + Math.min(score * 0.04, 1.8);

        // Bird Physics
        bird.velocity += GRAVITY;
        bird.y += bird.velocity;
        bird.rotation = Math.min(Math.PI / 2.5, Math.max(-Math.PI / 5, bird.velocity * 0.08));
        bird.wingCycle = Math.sin(frame * 0.25);

        // Shield invulnerability countdown
        if (shieldInvulTimer > 0) shieldInvulTimer--;

        // Ground offset
        groundOffset = (groundOffset + pipeSpeed) % 24;

        // Spawn Pipes
        if (frame % Math.max(75, Math.floor(105 - score * 0.4)) === 0) {
          spawnPipe();
        }

        // Update Pipes & Collisions
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= pipeSpeed;

          // Check score pass
          if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
            p.passed = true;
            score++;
            AudioEngine.playScore();
            addScorePopup("+1", bird.x + 10, bird.y - 15, "#22c55e");
            createSparkleBurst(bird.x + 20, bird.y, "#22c55e");
          }

          // Pipe Collision Detection
          const inPipeX = (bird.x + bird.radius - 3 > p.x && bird.x - bird.radius + 3 < p.x + PIPE_WIDTH);
          const inTopPipeY = bird.y - bird.radius + 3 < p.top;
          const inBottomPipeY = bird.y + bird.radius - 3 > p.bottomY;

          if (inPipeX && (inTopPipeY || inBottomPipeY)) {
            if (hasShield && shieldInvulTimer === 0) {
              hasShield = false;
              shieldInvulTimer = 40;
              AudioEngine.playShieldBreak();
              createSparkleBurst(bird.x, bird.y, "#a855f7");
              addScorePopup("SHIELD SAVED! 🛡️", bird.x, bird.y - 25, "#c084fc");
            } else if (shieldInvulTimer === 0) {
              triggerGameOver();
              return;
            }
          }

          // Remove off-screen pipes
          if (p.x + PIPE_WIDTH < -30) {
            pipes.splice(i, 1);
          }
        }

        // Update Bonus Items
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          item.x -= pipeSpeed;
          const floatY = item.y + Math.sin(frame * 0.1 + item.floatOffset) * 6;

          // Collision with bird
          const dist = Math.hypot(bird.x - item.x, bird.y - floatY);
          if (dist < bird.radius + 18) {
            if (item.isShield) {
              hasShield = true;
              AudioEngine.playBonus();
              addScorePopup("SHIELD ACTIVE! 🛡️", bird.x, bird.y - 20, "#c084fc");
              createSparkleBurst(item.x, floatY, "#a855f7");
            } else {
              score += item.pts;
              AudioEngine.playBonus();
              addScorePopup(`+${item.pts} ${item.emoji}`, bird.x, bird.y - 20, item.color);
              createSparkleBurst(item.x, floatY, item.color);
            }
            items.splice(i, 1);
            continue;
          }

          if (item.x < -30) items.splice(i, 1);
        }

        // Ground & Ceiling Collisions
        if (bird.y + bird.radius >= LOGICAL_HEIGHT - GROUND_HEIGHT) {
          bird.y = LOGICAL_HEIGHT - GROUND_HEIGHT - bird.radius;
          triggerGameOver();
          return;
        }
        if (bird.y - bird.radius <= 0) {
          bird.y = bird.radius;
          bird.velocity = 0;
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= pt.decay;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      // Update Popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        pop.y += pop.vy;
        pop.alpha -= 0.025;
        if (pop.alpha <= 0) popups.splice(i, 1);
      }
    }

    // ==========================================
    // Drawing & Rendering Engine
    // ==========================================
    function draw() {
      ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

      // 1. Sky Gradient & Stars
      const skyGrad = ctx.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT - GROUND_HEIGHT);
      skyGrad.addColorStop(0, "#090d16");
      skyGrad.addColorStop(0.5, "#17153b");
      skyGrad.addColorStop(0.85, "#431238");
      skyGrad.addColorStop(1, "#831843");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT - GROUND_HEIGHT);

      // Moon
      ctx.fillStyle = "rgba(254, 240, 138, 0.85)";
      ctx.beginPath();
      ctx.arc(300, 75, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#090d16";
      ctx.beginPath();
      ctx.arc(292, 70, 20, 0, Math.PI * 2);
      ctx.fill();

      // Stars
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Distant City Skyline Silhouette
      ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
      ctx.beginPath();
      ctx.moveTo(0, LOGICAL_HEIGHT - GROUND_HEIGHT);
      const buildings = [
        [0, 50], [25, 80], [55, 60], [80, 110], [115, 75],
        [150, 95], [190, 130], [230, 85], [270, 105], [315, 70], [360, 90]
      ];
      buildings.forEach(([bx, bh]) => {
        ctx.lineTo(bx, LOGICAL_HEIGHT - GROUND_HEIGHT - bh);
      });
      ctx.lineTo(LOGICAL_WIDTH, LOGICAL_HEIGHT - GROUND_HEIGHT);
      ctx.fill();

      // Clouds
      clouds.forEach(c => {
        ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
        ctx.beginPath();
        ctx.roundRect(c.x, c.y, c.w, c.h, 16);
        ctx.fill();
      });

      // 2. Pipes
      pipes.forEach(p => {
        // Top Pipe Body
        const topGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
        topGrad.addColorStop(0, "#059669");
        topGrad.addColorStop(0.35, "#34d399");
        topGrad.addColorStop(0.7, "#10b981");
        topGrad.addColorStop(1, "#047857");

        ctx.fillStyle = topGrad;
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);

        // Top Pipe Cap
        ctx.fillStyle = "#047857";
        ctx.beginPath();
        ctx.roundRect(p.x - 4, p.top - 24, PIPE_WIDTH + 8, 24, 6);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fillRect(p.x - 2, p.top - 22, 6, 20);

        // Bottom Pipe Body
        ctx.fillStyle = topGrad;
        ctx.fillRect(p.x, p.bottomY, PIPE_WIDTH, p.bottomHeight);

        // Bottom Pipe Cap
        ctx.fillStyle = "#047857";
        ctx.beginPath();
        ctx.roundRect(p.x - 4, p.bottomY, PIPE_WIDTH + 8, 24, 6);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fillRect(p.x - 2, p.bottomY + 2, 6, 20);
      });

      // 3. Bonus Collectibles
      items.forEach(it => {
        const floatY = it.y + Math.sin(frame * 0.1 + it.floatOffset) * 6;
        ctx.save();
        ctx.shadowColor = it.color;
        ctx.shadowBlur = 12;
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(it.emoji, it.x, floatY);
        ctx.restore();
      });

      // 4. Particles
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, Math.max(0.1, pt.radius * pt.life), 0, Math.PI * 2);
        ctx.fill();
      });

      // 5. Bird Drawing
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      // Shield Aura
      if (hasShield || shieldInvulTimer > 0) {
        ctx.strokeStyle = "rgba(192, 132, 252, 0.85)";
        ctx.lineWidth = 3;
        ctx.shadowColor = "#a855f7";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(0, 0, bird.radius + 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Bird Body Gradient
      const birdGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, bird.radius);
      birdGrad.addColorStop(0, "#fef08a");
      birdGrad.addColorStop(0.6, "#facc15");
      birdGrad.addColorStop(1, "#ca8a04");

      ctx.fillStyle = birdGrad;
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Cute Belly
      ctx.fillStyle = "#fffbeb";
      ctx.beginPath();
      ctx.arc(-2, 4, bird.radius * 0.65, 0, Math.PI);
      ctx.fill();

      // Wing (Animated Flapping)
      ctx.fillStyle = "#eab308";
      ctx.beginPath();
      ctx.ellipse(-6, bird.wingCycle * 4, 9, 6, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ca8a04";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Big Cartoon Eye
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(6, -5, 6.5, 0, Math.PI * 2);
      ctx.fill();

      // Eye Pupil
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(8, -5, 3.2, 0, Math.PI * 2);
      ctx.fill();

      // Eye Glint
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(9.2, -6.5, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Orange Beak
      ctx.fillStyle = "#ea580c";
      ctx.beginPath();
      ctx.moveTo(11, -3);
      ctx.lineTo(19, 1);
      ctx.lineTo(10, 5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // 6. Ground Surface
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, LOGICAL_HEIGHT - GROUND_HEIGHT, LOGICAL_WIDTH, GROUND_HEIGHT);

      // Glowing Neon Ground Stripe
      ctx.fillStyle = "#38bdf8";
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 10;
      ctx.fillRect(0, LOGICAL_HEIGHT - GROUND_HEIGHT, LOGICAL_WIDTH, 4);
      ctx.shadowBlur = 0;

      // Ground Texture Pattern
      ctx.fillStyle = "#334155";
      for (let x = -groundOffset; x < LOGICAL_WIDTH + 24; x += 24) {
        ctx.beginPath();
        ctx.moveTo(x, LOGICAL_HEIGHT - GROUND_HEIGHT + 4);
        ctx.lineTo(x + 10, LOGICAL_HEIGHT - GROUND_HEIGHT + 24);
        ctx.lineTo(x + 5, LOGICAL_HEIGHT - GROUND_HEIGHT + 24);
        ctx.lineTo(x - 5, LOGICAL_HEIGHT - GROUND_HEIGHT + 4);
        ctx.fill();
      }

      // 7. Popups
      popups.forEach(pop => {
        ctx.save();
        ctx.fillStyle = pop.color;
        ctx.globalAlpha = Math.max(0, pop.alpha);
        ctx.font = "bold 17px sans-serif";
        ctx.textAlign = "center";
        ctx.shadowColor = pop.color;
        ctx.shadowBlur = 8;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();
      });

      // 8. Live HUD
      if (gameState === "PLAYING") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 36px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 8;
        ctx.fillText(score, LOGICAL_WIDTH / 2, 60);
        ctx.shadowBlur = 0;

        // Shield Indicator
        if (hasShield) {
          ctx.font = "14px sans-serif";
          ctx.fillStyle = "#c084fc";
          ctx.textAlign = "left";
          ctx.fillText("🛡️ Shield Ready", 18, 30);
        }
      }

      // 9. Start Screen
      if (gameState === "START") {
        ctx.fillStyle = "rgba(11, 15, 25, 0.78)";
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        ctx.fillStyle = "#facc15";
        ctx.font = "800 32px sans-serif";
        ctx.textAlign = "center";
        ctx.shadowColor = "#facc15";
        ctx.shadowBlur = 12;
        ctx.fillText("🐥 Flappy Odyssey", LOGICAL_WIDTH / 2, 210);
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#ffffff";
        ctx.font = "14px sans-serif";
        ctx.fillText("Flap through neon pipes & collect power-ups!", LOGICAL_WIDTH / 2, 250);
        ctx.fillText("⭐ Stars (+3) • 💎 Gems (+5) • 🛡️ Shields", LOGICAL_WIDTH / 2, 275);

        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText("👉 Tap Screen to Fly 👈", LOGICAL_WIDTH / 2, 380);

        if (highscore > 0) {
          ctx.fillStyle = "#fbbf24";
          ctx.font = "14px sans-serif";
          ctx.fillText(`👑 Best Score: ${highscore}`, LOGICAL_WIDTH / 2, 430);
        }
      }

      // 10. Game Over Screen
      if (gameState === "GAMEOVER") {
        ctx.fillStyle = "rgba(11, 15, 25, 0.88)";
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        ctx.fillStyle = "#ef4444";
        ctx.font = "800 32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("💥 Game Over", LOGICAL_WIDTH / 2, 190);

        // Score Card Box
        ctx.fillStyle = "rgba(30, 41, 59, 0.9)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(40, 220, LOGICAL_WIDTH - 80, 160, 16);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#94a3b8";
        ctx.font = "12px sans-serif";
        ctx.fillText("SCORE", 100, 255);
        ctx.fillText("BEST", 260, 255);

        ctx.fillStyle = "#ffffff";
        ctx.font = "800 32px sans-serif";
        ctx.fillText(score, 100, 295);

        ctx.fillStyle = "#facc15";
        ctx.fillText(highscore, 260, 295);

        // Award Medal
        let medal = "🥉 Bronze";
        if (score >= 50) medal = "💎 Platinum";
        else if (score >= 25) medal = "🥇 Gold";
        else if (score >= 10) medal = "🥈 Silver";

        if (score >= 5) {
          ctx.fillStyle = "#38bdf8";
          ctx.font = "bold 14px sans-serif";
          ctx.fillText(`Medal: ${medal}`, LOGICAL_WIDTH / 2, 350);
        }

        if (isNewHighscore) {
          ctx.fillStyle = "#22c55e";
          ctx.font = "bold 14px sans-serif";
          ctx.fillText("🎉 NEW BEST RECORD! 🎉", LOGICAL_WIDTH / 2, 415);
        }

        const elapsedSinceGameOver = performance.now() - gameOverTime;
        if (elapsedSinceGameOver < RESTART_COOLDOWN_MS) {
          const remainingSec = ((RESTART_COOLDOWN_MS - elapsedSinceGameOver) / 1000).toFixed(1);
          ctx.fillStyle = "#94a3b8";
          ctx.font = "bold 15px sans-serif";
          ctx.fillText(`⏳ Saving Score (${remainingSec}s)...`, LOGICAL_WIDTH / 2, 470);
        } else {
          ctx.fillStyle = "#38bdf8";
          ctx.font = "bold 18px sans-serif";
          ctx.fillText("👉 Tap to Play Again 👈", LOGICAL_WIDTH / 2, 470);
        }
      }

      requestAnimationFrame(() => {
        update();
        draw();
      });
    }

    draw();
  </script>
</body>
</html>
