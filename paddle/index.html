<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Couple Paddle Clash</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://telegram.org/js/games.js"></script>
  <style>
    :root {
      --me-color: #00f2fe;
      --me-glow: rgba(0, 242, 254, 0.4);
      --partner-color: #ff0844;
      --partner-glow: rgba(255, 8, 68, 0.4);
      --bg-dark: #090d16;
      --card-bg: rgba(255, 255, 255, 0.05);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #161f36 0%, var(--bg-dark) 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 95vw;
      max-width: 440px;
      margin-bottom: 12px;
      padding: 10px 16px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .player-card {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .player-card.me { align-items: flex-start; }
    .player-card.partner { align-items: flex-end; }
    .p-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .me .p-tag { color: var(--me-color); }
    .partner .p-tag { color: var(--partner-color); }
    .hearts {
      font-size: 15px;
      letter-spacing: 2px;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.3));
    }
    #match-status {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-align: center;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.2);
    }
    #game-container {
      position: relative;
      width: 95vw;
      max-width: 440px;
      height: 65vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(0, 0, 0, 0.4);
      display: block;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
      z-index: 10;
    }
    #overlay h2 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #00f2fe;
      background: linear-gradient(135deg, #00f2fe 0%, #ff0844 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #overlay p {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .pulse-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00f2fe;
      box-shadow: 0 0 12px #00f2fe;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
    button {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, #00f2fe 0%, #ff0844 100%);
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div id="hud">
    <div class="player-card me">
      <span class="p-tag">💙 You</span>
      <span class="hearts" id="my-hearts">❤️❤️❤️❤️❤️</span>
    </div>
    <div id="match-status">Connecting ⏳</div>
    <div class="player-card partner">
      <span class="p-tag">Partner ❤️</span>
      <span class="hearts" id="partner-hearts">❤️❤️❤️❤️❤️</span>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div id="overlay">
      <div class="pulse-dot" id="overlay-anim"></div>
      <h2 id="modal-title">Connecting...</h2>
      <p id="modal-desc">Waiting for your partner to open the game...</p>
      <button id="btn-replay" style="display: none;" onclick="restartMatch()">🔄 Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    const urlParams = new URLSearchParams(window.location.search);
    const myUserId = urlParams.get("user_id") || "";
    const chatId = urlParams.get("chat_id") || "";
    const msgId = urlParams.get("msg_id") || "";
    const inlineId = urlParams.get("inline_id") || "";
    const botToken = urlParams.get("token") || "";

    // VPN & Restrictive NAT Traversal Config
    const PEER_CONFIG = {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" },
          { urls: "stun:stun.cloudflare.com:3478" },
          {
            urls: "turn:openrelay.metered.ca:80",
            username: "openrelayproject",
            credential: "openrelayproject"
          },
          {
            urls: "turn:openrelay.metered.ca:443",
            username: "openrelayproject",
            credential: "openrelayproject"
          },
          {
            urls: "turn:openrelay.metered.ca:443?transport=tcp",
            username: "openrelayproject",
            credential: "openrelayproject"
          }
        ]
      }
    };

    function getFixedRoomCode() {
      const seed = inlineId || (chatId + "_" + msgId) || "couple_paddle_duel";
      let hash = 0;
      for (let i = 0; i < seed.length; i++) {
        hash = (hash << 5) - hash + seed.charCodeAt(i);
        hash |= 0;
      }
      return "clash_" + Math.abs(hash).toString(36);
    }

    const roomCode = getFixedRoomCode();

    let hostUserId = "";
    let clientUserId = "";

    const MAX_LIVES = 5;
    let hostLives = MAX_LIVES;
    let clientLives = MAX_LIVES;
    let rallyCount = 0;
    let isRunning = false;
    let role = "spectator"; // "host", "client"

    const paddleWidth = 84;
    const paddleHeight = 12;
    let hostX = 158;   // Host physical X
    let clientX = 158; // Client physical X
    let ball = { x: 200, y: 300, vx: 0, vy: 0, r: 8, baseSpeed: 5.5 };
    let particles = [];

    let peer = null;
    let conn = null;

    function autoConnect() {
      peer = new Peer(roomCode, PEER_CONFIG);

      peer.on("open", () => {
        role = "host";
        hostUserId = myUserId;
        document.getElementById("modal-title").innerText = "Waiting for Partner...";
        document.getElementById("modal-desc").innerText = "Game is paused until your partner opens the game!";
      });

      peer.on("connection", (c) => {
        conn = c;
        setupDataChannel();
      });

      peer.on("error", (err) => {
        if (err.type === "unavailable-id") {
          role = "client";
          clientUserId = myUserId;
          peer.destroy();
          joinAsClient();
        }
      });
    }

    function joinAsClient() {
      peer = new Peer(PEER_CONFIG);
      peer.on("open", () => {
        conn = peer.connect(roomCode);
        document.getElementById("modal-title").innerText = "Connecting to Host...";
        setupDataChannel();
      });
    }

    function setupDataChannel() {
      conn.on("open", () => {
        document.getElementById("overlay").style.display = "none";
        document.getElementById("match-status").innerText = "⚡ DUEL ACTIVE";

        if (role === "client") {
          conn.send({ type: "HELLO_CLIENT", userId: myUserId });
        }
      });

      conn.on("data", (data) => {
        if (role === "host") {
          if (data.type === "HELLO_CLIENT") {
            clientUserId = data.userId;
            conn.send({ type: "HELLO_HOST", userId: hostUserId });
            resetRound(1);
            isRunning = true;
          } else if (data.type === "CLIENT_INPUT") {
            clientX = data.clientX;
          }
        } else if (role === "client") {
          if (data.type === "HELLO_HOST") {
            hostUserId = data.userId;
          } else if (data.type === "SYNC") {
            ball = data.ball;
            hostX = data.hostX;
            hostLives = data.hostLives;
            clientLives = data.clientLives;
            rallyCount = data.rally;
            updateHeartsUI();
            if (data.hit) {
              const sparkY = canvas.height - ball.y;
              createSparks(ball.x, sparkY, data.hitColor);
            }
          } else if (data.type === "GAME_OVER") {
            handleGameOver(data.winnerRole);
          } else if (data.type === "RESTART") {
            resetLocalUI();
          }
        }
      });

      conn.on("close", () => {
        document.getElementById("overlay").style.display = "flex";
        document.getElementById("modal-title").innerText = "Partner Left";
        document.getElementById("modal-desc").innerText = "Waiting for reconnection...";
        isRunning = false;
      });
    }

    function updateHeartsUI() {
      const myLives = role === "host" ? hostLives : clientLives;
      const partnerLives = role === "host" ? clientLives : hostLives;

      document.getElementById("my-hearts").innerText = "❤️".repeat(Math.max(0, myLives)) + "🖤".repeat(Math.max(0, MAX_LIVES - myLives));
      document.getElementById("partner-hearts").innerText = "❤️".repeat(Math.max(0, partnerLives)) + "🖤".repeat(Math.max(0, MAX_LIVES - partnerLives));
    }

    function createSparks(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1.0,
          color
        });
      }
    }

    // Touch & Mouse Input (Maps to bottom paddle on both devices)
    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const x = (e.touches[0].clientX - rect.left) * scaleX - paddleWidth / 2;
      setPaddlePosition(x);
    }, { passive: false });

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const x = (e.clientX - rect.left) * scaleX - paddleWidth / 2;
      setPaddlePosition(x);
    });

    function setPaddlePosition(x) {
      const clamped = Math.max(4, Math.min(canvas.width - paddleWidth - 4, x));
      if (role === "host") {
        hostX = clamped;
      } else if (role === "client") {
        clientX = clamped;
        if (conn && conn.open) conn.send({ type: "CLIENT_INPUT", clientX: clamped });
      }
    }

    function resetRound(servingPlayer) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * 0.6 - 0.3) * Math.PI;
      const dir = servingPlayer === 1 ? 1 : -1;
      ball.vx = Math.sin(angle) * ball.baseSpeed;
      ball.vy = Math.cos(angle) * ball.baseSpeed * dir;
      rallyCount = 0;
    }

    function updatePhysics() {
      if (role !== "host" || !isRunning) return;

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.r <= 0) {
        ball.x = ball.r;
        ball.vx *= -1;
        createSparks(ball.x, ball.y, "#ffffff");
      } else if (ball.x + ball.r >= canvas.width) {
        ball.x = canvas.width - ball.r;
        ball.vx *= -1;
        createSparks(ball.x, ball.y, "#ffffff");
      }

      let hitColor = null;

      // Host Paddle (Physically Bottom)
      if (ball.y + ball.r >= canvas.height - 24 && ball.y - ball.r <= canvas.height - 12) {
        if (ball.x >= hostX - 4 && ball.x <= hostX + paddleWidth + 4) {
          const hitOffset = (ball.x - (hostX + paddleWidth / 2)) / (paddleWidth / 2);
          ball.vx = hitOffset * 6.5;
          ball.vy = -Math.abs(ball.vy) * 1.04;
          rallyCount++;
          hitColor = "#00f2fe";
          createSparks(ball.x, ball.y, hitColor);
        }
      }

      // Client Paddle (Physically Top)
      if (ball.y - ball.r <= 24 && ball.y + ball.r >= 12) {
        if (ball.x >= clientX - 4 && ball.x <= clientX + paddleWidth + 4) {
          const hitOffset = (ball.x - (clientX + paddleWidth / 2)) / (paddleWidth / 2);
          ball.vx = hitOffset * 6.5;
          ball.vy = Math.abs(ball.vy) * 1.04;
          rallyCount++;
          hitColor = "#ff0844";
          createSparks(ball.x, ball.y, hitColor);
        }
      }

      // 5-Heart Life Penalty
      if (ball.y > canvas.height + 20) {
        hostLives--;
        updateHeartsUI();
        if (hostLives <= 0) endGame("client", clientUserId);
        else resetRound(2);
      } else if (ball.y < -20) {
        clientLives--;
        updateHeartsUI();
        if (clientLives <= 0) endGame("host", hostUserId);
        else resetRound(1);
      }

      if (conn && conn.open) {
        conn.send({
          type: "SYNC",
          ball, hostX, hostLives, clientLives,
          rally: rallyCount,
          hit: !!hitColor,
          hitColor
        });
      }
    }

    let winLogged = false;

    function endGame(winnerRole, winningUserId) {
      isRunning = false;
      if (conn && conn.open) conn.send({ type: "GAME_OVER", winnerRole });
      handleGameOver(winnerRole);
    }

    function handleGameOver(winnerRole) {
      const isWinner = role === winnerRole;
      const title = isWinner ? "🏆 You Won!" : "💔 Partner Won!";
      const desc = isWinner 
        ? `Great job! You won the Clash!\nLongest Rally: ${rallyCount} hits` 
        : `Partner took this round!\nLongest Rally: ${rallyCount} hits`;

      document.getElementById("overlay").style.display = "flex";
      document.getElementById("overlay-anim").style.display = "none";
      document.getElementById("modal-title").innerText = title;
      document.getElementById("modal-desc").innerText = desc;
      document.getElementById("btn-replay").style.display = (role === "host") ? "inline-block" : "none";

      const winningUserId = (winnerRole === "host") ? hostUserId : clientUserId;
      if (!winLogged && (role === "host" || role === winnerRole)) {
        incrementTelegramWin(winningUserId);
      }
    }

    function resetLocalUI() {
      winLogged = false;
      hostLives = MAX_LIVES;
      clientLives = MAX_LIVES;
      updateHeartsUI();
      document.getElementById("overlay").style.display = "none";
      document.getElementById("btn-replay").style.display = "none";
      document.getElementById("overlay-anim").style.display = "block";
    }

    function restartMatch() {
      resetLocalUI();
      if (role === "host") {
        resetRound(1);
        isRunning = true;
        if (conn && conn.open) conn.send({ type: "RESTART" });
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      const myX = role === "host" ? hostX : clientX;
      const partnerX = role === "host" ? clientX : hostX;

      // Top Paddle (Partner - Red)
      ctx.fillStyle = "#ff0844";
      ctx.shadowColor = "rgba(255, 8, 68, 0.6)";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.roundRect(partnerX, 14, paddleWidth, paddleHeight, 6);
      ctx.fill();

      // Bottom Paddle (You - Cyan)
      ctx.fillStyle = "#00f2fe";
      ctx.shadowColor = "rgba(0, 242, 254, 0.6)";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.roundRect(myX, canvas.height - 26, paddleWidth, paddleHeight, 6);
      ctx.fill();

      // Ball Coordinate (Inverted for client perspective)
      if (isRunning || role === "client") {
        const renderBallY = role === "host" ? ball.y : (canvas.height - ball.y);
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#facc15";
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(ball.x, renderBallY, ball.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
      ctx.shadowBlur = 0;
    }

    function loop() {
      updatePhysics();
      render();
      requestAnimationFrame(loop);
    }

    async function incrementTelegramWin(targetUserId) {
      if (!botToken || !targetUserId || winLogged) return;
      winLogged = true;

      const targetIdNum = parseInt(targetUserId, 10);
      if (isNaN(targetIdNum) || targetIdNum <= 0) return;

      const basePayload = {};
      if (inlineId && inlineId.trim() !== "" && inlineId !== "null" && inlineId !== "undefined") {
        basePayload.inline_message_id = inlineId.trim();
      } else if (chatId && msgId) {
        const cId = parseInt(chatId, 10);
        const mId = parseInt(msgId, 10);
        if (!isNaN(cId) && !isNaN(mId)) {
          basePayload.chat_id = cId;
          basePayload.message_id = mId;
        } else {
          return;
        }
      } else {
        return;
      }

      let currentScore = 0;

      try {
        const getUrl = `https://api.telegram.org/bot${botToken}/getGameHighScores`;
        const res = await fetch(getUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: targetIdNum, ...basePayload })
        });
        const data = await res.json();
        if (data.ok && Array.isArray(data.result)) {
          const userScoreObj = data.result.find(s => s.user && s.user.id === targetIdNum);
          if (userScoreObj && typeof userScoreObj.score === "number") currentScore = userScoreObj.score;
        }
      } catch (e) {
        console.warn("getGameHighScores error:", e);
      }

      const newScore = currentScore + 1;

      try {
        const setUrl = `https://api.telegram.org/bot${botToken}/setGameScore`;
        const setBody = {
          user_id: targetIdNum,
          score: newScore,
          force: true,
          disable_edit_message: false,
          ...basePayload
        };
        const res = await fetch(setUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(setBody)
        });
        const data = await res.json();
        console.log("Paddle setGameScore result:", data);
      } catch (e) {
        console.warn("setGameScore error:", e);
      }

      try {
        if (window.TelegramGameProxy && typeof window.TelegramGameProxy.setScore === "function") {
          window.TelegramGameProxy.setScore(newScore);
        }
      } catch (e) {}
    }

    autoConnect();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
